# Porta de entrada do CI/CD da Pack: diz QUANDO rodar e EM QUE ORDEM.
# Os passos de cada etapa ficam em .github/actions/ (ações locais, a convenção do GitHub).
# Explicação: .github/workflows/README.md
#
#   CI (todo push e pull request para a main): testes da API + imagem Docker + Trivy → .github/actions/ci-backend
#   CodeQL (junto com o CI): procura falhas de segurança no código                → .github/actions/codeql
#   CD (só push na main, e só se o CI passar): publica no Google Cloud Run     → .github/actions/deploy
#   CI do site (todo push e pull request): ESLint + tipos + testes + build      → .github/actions/ci-frontend
#   CD do site (só push na main, e só se o CI do site passar): Cloudflare       → .github/actions/deploy-site

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (testes + imagem Docker)
    runs-on: ubuntu-latest
    steps:
      # ações locais só existem depois que o código é baixado
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CI do backend
        uses: ./.github/actions/ci-backend

  frontend:
    name: Frontend (testes + build)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CI do frontend
        uses: ./.github/actions/ci-frontend

  codeql:
    name: CodeQL (falhas de segurança no código)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write            # envia os alertas para a aba Security do repositório
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CodeQL do backend
        uses: ./.github/actions/codeql

  deploy:
    name: Deploy no Cloud Run
    needs: backend                      # só roda se os testes e a imagem passaram
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # um deploy por vez: se dois pushes chegarem juntos, o segundo espera o primeiro
    concurrency: deploy-producao
    permissions:
      contents: read
      id-token: write                   # permite pedir o token OIDC que o Google aceita no lugar de uma senha
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy no Cloud Run
        uses: ./.github/actions/deploy
        with:
          projeto: ${{ vars.GCP_PROJECT_ID }}
          regiao: ${{ vars.GCP_REGION }}
          provedor-wif: ${{ vars.GCP_WIF_PROVIDER }}
          conta-deploy: ${{ vars.GCP_DEPLOY_SA }}

  deploy-site:
    name: Deploy do site na Cloudflare
    needs: frontend                     # só roda se o código, os testes e o build do site passaram
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-site            # um deploy do site por vez
    permissions:
      contents: read
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # monta o build de novo neste job (cada job começa numa máquina limpa) e confere tudo outra vez
      - name: CI do frontend
        uses: ./.github/actions/ci-frontend

      - name: Deploy na Cloudflare
        uses: ./.github/actions/deploy-site
        with:
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          conta: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
