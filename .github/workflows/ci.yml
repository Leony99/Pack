# CI da Pack: a cada envio para o GitHub (ou pull request para a main),
# uma máquina Linux temporária roda os testes da API e confere se a imagem Docker monta.
# Resultado na aba "Actions" do repositório e no selo do README.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (testes + imagem Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # todos os comandos rodam de dentro de backend/

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven                # guarda as dependências entre execuções (fica mais rápido)

      # Os testes sobem o próprio PostgreSQL com Testcontainers.
      # O Docker já vem instalado na máquina do GitHub, e não precisa de .env nem de segredos.
      - name: Rodar os testes
        run: ./mvnw -B test

      # Se algum teste falhar, guarda os relatórios para baixar na página da execução
      - name: Guardar relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-testes
          path: backend/target/surefire-reports/

      - name: Montar a imagem Docker
        run: docker build -t pack-api .
