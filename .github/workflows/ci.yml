# Porta de entrada do CI/CD da Pack: diz QUANDO rodar e EM QUE ORDEM.
# Os passos de cada etapa ficam em ci-cd/ (o GitHub só lê workflows desta pasta,
# mas aceita ações locais em qualquer lugar do repositório). Explicação: ci-cd/README.md
#
#   CI (todo push e pull request para a main): testes da API + imagem Docker  → ci-cd/ci-backend
#   CD (só push na main, e só se o CI passar): publica no Google Cloud Run     → ci-cd/deploy

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (testes + imagem Docker)
    runs-on: ubuntu-latest
    steps:
      # ações locais só existem depois que o código é baixado
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: CI do backend
        uses: ./ci-cd/ci-backend

  deploy:
    name: Deploy no Cloud Run
    needs: backend                      # só roda se os testes e a imagem passaram
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # um deploy por vez: se dois pushes chegarem juntos, o segundo espera o primeiro
    concurrency: deploy-producao
    permissions:
      contents: read
      id-token: write                   # permite pedir o token OIDC que o Google aceita no lugar de uma senha
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Deploy no Cloud Run
        uses: ./ci-cd/deploy
        with:
          projeto: ${{ vars.GCP_PROJECT_ID }}
          regiao: ${{ vars.GCP_REGION }}
          provedor-wif: ${{ vars.GCP_WIF_PROVIDER }}
          conta-deploy: ${{ vars.GCP_DEPLOY_SA }}
