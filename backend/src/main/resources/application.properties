# --- Nome ---
spring.application.name=pack-api

# --- Segredos e configurações de cada ambiente ---
# Lidos de variáveis de ambiente ou do .env na raiz do repositório (copie o .env.example; o .env não vai para o git).
# ../.env é a raiz quando a API roda de dentro de backend/ (./mvnw); no Docker as variáveis vêm do Compose.
# Senhas e a chave do JWT não têm valor padrão: se faltarem, a aplicação nem sobe.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Conexão com o banco de dados ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pack-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuração do Hibernate/JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
# o ddl-auto=update avisa "constraint ... does not exist, skipping" num banco novo; é só ruído
logging.level.org.hibernate.orm.jdbc.warn=ERROR

# --- Porta da aplicação ---
server.port=8080

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60

# --- Admin inicial (criado na primeira vez que a aplicação sobe) ---
app.admin.email=${ADMIN_EMAIL:admin@packapi.com}
app.admin.senha=${ADMIN_PASSWORD}

# --- Swagger (página em /swagger-ui.html) ---
# guarda o token do botão Authorize ao recarregar a página
springdoc.swagger-ui.persist-authorization=true
# grupos em ordem alfabética e, dentro de cada um, rotas agrupadas por método (GET, POST...)
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
