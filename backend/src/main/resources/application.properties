# --- Nome ---
spring.application.name=pack-api

# --- Segredos e configurações de cada ambiente ---
# Lidos de variáveis de ambiente ou do backend/.env (copie o .env.example; o .env não vai para o git).
# .env quando a API roda de dentro de backend/ (./mvnw); backend/.env quando roda da raiz do repositório
# (ex.: pela IDE). No Docker as variáveis vêm do Compose.
# Senhas e a chave do JWT não têm valor padrão: se faltarem, a aplicação nem sobe.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# --- Conexão com o banco de dados ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pack-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuração do Hibernate/JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
# N+1: sem isto, montar uma página de 100 produtos fazia uma consulta de imagens, uma de tags e uma de
# variantes POR produto (cerca de 300). Com o lote, o Hibernate busca as de até 100 produtos de uma vez
# (WHERE product_id IN (...)): a página inteira sai em poucas consultas
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# /actuator/health/liveness: responde se a API está de pé SEM consultar o banco (o despertador do Cloud
# Scheduler chama esta; a /actuator/health completa acordaria o Neon a cada chamada)
management.endpoint.health.probes.enabled=true
# o ddl-auto=update avisa "constraint ... does not exist, skipping" num banco novo; é só ruído
logging.level.org.hibernate.orm.jdbc.warn=ERROR

# --- Porta da aplicação ---
# o Cloud Run informa a porta pela variável PORT; localmente fica a 8080
server.port=${PORT:8080}

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60

# --- Limite de tentativas no login, no cadastro e nos cupons (ver LimiteDeTentativas) ---
# 5 senhas erradas do mesmo e-mail no mesmo IP, ou 20 falhas/cadastros do mesmo IP → bloqueio de 15 min (429)
app.login.max-falhas-email-ip=5
app.login.max-falhas-ip=20
app.login.bloqueio-minutos=15
# 5 códigos de cupom errados do mesmo cliente no checkout → 15 min sem poder usar cupom (429)
app.cupom.max-erros=5
# PROVISÓRIO, até a loja ter um gateway de pagamento: o pagamento que o cliente registra já nasce aprovado
# (sem cobrança). Desligar quando o gateway entrar (ver "Próximos passos" no README)
app.pagamento.aprovacao-simulada=${PAGAMENTO_SIMULADO:true}

# --- Limite geral por IP, em todas as rotas (ver LimitePorIp) ---
# 120 requisições por minuto do mesmo IP (2 por segundo, folgado para uma pessoa navegando) → 429 até o minuto acabar
app.limite-ip.max-requisicoes=120
app.limite-ip.janela-segundos=60

# --- Admin inicial (criado na primeira vez que a aplicação sobe) ---
app.admin.email=${ADMIN_EMAIL:admin@packapi.com}
app.admin.senha=${ADMIN_PASSWORD}

# --- Swagger (página em /swagger-ui.html) ---
# guarda o token do botão Authorize ao recarregar a página
springdoc.swagger-ui.persist-authorization=true
# grupos em ordem alfabética e, dentro de cada um, rotas agrupadas por método (GET, POST...)
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
