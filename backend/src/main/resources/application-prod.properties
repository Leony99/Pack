# Configurações só de produção (Cloud Run + Neon). Somam-se às do application.properties.
# Ativadas com a variável SPRING_PROFILES_ACTIVE=prod, definida no serviço do Cloud Run.

# --- Banco (Neon) ---
# O Neon grátis limita as conexões, e o Cloud Run roda no máximo 1 instância: 5 conexões sobram.
# minimum-idle=0 fecha as conexões paradas, para o Neon poder desligar quando ninguém usa.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# --- Logs ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# O Swagger fica ligado de propósito (é a vitrine da API); o aviso do springdoc para desligá-lo é só ruído.
logging.level.org.springdoc=ERROR

# --- Atrás do proxy do Google ---
# O Cloud Run recebe HTTPS e repassa para a aplicação em HTTP, com os cabeçalhos X-Forwarded-*.
# "native": o Tomcat lê esses cabeçalhos só quando a conexão vem de um endereço interno (o proxy do Google):
#   - X-Forwarded-Proto: a aplicação sabe que a requisição era HTTPS (links do Swagger, cabeçalho HSTS);
#   - X-Forwarded-For: lido da DIREITA para a esquerda, o IP do usuário é o que o Google acrescentou.
#     O que o próprio usuário escreve no cabeçalho fica à esquerda e é ignorado, então ninguém
#     consegue trocar de "IP" a cada tentativa para fugir do limite de login.
# ("framework", o modo anterior, usava o primeiro IP da lista, que o usuário pode inventar.)
server.forward-headers-strategy=native
