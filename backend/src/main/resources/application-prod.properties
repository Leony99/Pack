# Configurações só de produção (Cloud Run + Neon). Somam-se às do application.properties.
# Ativadas com a variável SPRING_PROFILES_ACTIVE=prod, definida no serviço do Cloud Run.

# --- Banco (Neon) ---
# O Neon grátis limita as conexões, e o Cloud Run roda no máximo 1 instância: 5 conexões sobram.
# minimum-idle=0 fecha as conexões paradas, para o Neon poder desligar quando ninguém usa.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# --- Logs ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# O Swagger fica ligado de propósito (é a vitrine da API); o aviso do springdoc para desligá-lo é só ruído.
logging.level.org.springdoc=ERROR

# --- Atrás do proxy do Google ---
# O Cloud Run recebe HTTPS e repassa para a aplicação em HTTP. Com isto, o Spring lê os cabeçalhos
# X-Forwarded-* e gera links com https:// (o "Try it out" do Swagger depende disso).
server.forward-headers-strategy=framework
