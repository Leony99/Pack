# Sobe o backend (banco + API) com um comando, daqui de backend/:   docker compose up --build
# Desliga tudo, mantendo os containers e os dados:                docker compose stop
# Só o banco (para rodar a API pelo ./mvnw):                       docker compose up -d db
#
# Os valores ${...} vêm do .env aqui de backend/ (copie o .env.example).

# Nome fixo do projeto: sem ele, o Compose usaria o nome da pasta ("backend") e criaria outro
# volume, e o banco de desenvolvimento pareceria vazio. Com "pack", o volume continua pack_pack-db-data.
name: pack

services:

  # Banco PostgreSQL, na mesma versão do banco de produção (Neon).
  # Os dados ficam no volume "pack-db-data" e sobrevivem ao "down" (só somem com "docker compose down -v").
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: pack-db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"   # aberto no seu PC para o ./mvnw e para ferramentas como DBeaver
    volumes:
      - pack-db-data:/var/lib/postgresql   # a partir do 18 a imagem usa esta pasta (antes era .../data)
    # "Está pronto?" — a API só sobe depois que o banco responde aqui
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A API, montada pelo Dockerfile daqui de backend/
  api:
    build: .
    env_file: .env
    environment:
      # Dentro do Compose cada serviço é encontrado pelo nome: o banco é "db", não "localhost"
      DB_URL: jdbc:postgresql://db:5432/pack-db
      SPRING_JPA_SHOW_SQL: "false"
    # Fotos enviadas pelo painel: sem bucket, ficam neste volume e a própria API as serve em /imagens
    volumes:
      - pack-uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pack-db-data:
  pack-uploads:
