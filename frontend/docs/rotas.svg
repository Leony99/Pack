<text x="30" y="50" font-size="24" font-weight="700" fill="#e6edf3">Pack frontend: rotas</text>
<text x="30" y="78" font-size="13" font-weight="400" fill="#8b949e">Cada página do site: a URL, o arquivo em src/routes, o que ela mostra e as funções de src/lib/api que buscam os dados.</text>
<text x="30" y="98" font-size="13" font-weight="400" fill="#8b949e">O nome do arquivo vira a URL: ponto = barra, $ = parâmetro, e o _ no fim (conta_, admin_) não entra na URL.</text>
