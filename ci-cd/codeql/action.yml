# CodeQL: análise estática do código Java, em busca de falhas de segurança.
# Chamado pelo .github/workflows/ci.yml (o código já precisa estar baixado com actions/checkout).
# O job precisa da permissão security-events: write para enviar os alertas à aba Security do GitHub.

name: CodeQL do backend
description: Compila a API e procura falhas de segurança no código com o CodeQL

runs:
  using: composite
  steps:
    - name: Instalar o Java 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
        cache: maven

    # Ações de terceiros fixadas pelo SHA do commit (e não pela tag, que pode ser movida para outro código)
    - name: Preparar o CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: java-kotlin
        build-mode: manual           # o CodeQL observa a compilação abaixo para entender o código
        queries: security-extended   # o conjunto de consultas de segurança mais amplo

    - name: Compilar a API
      shell: bash
      working-directory: backend
      run: ./mvnw -B -q -DskipTests package

    - name: Analisar e enviar os alertas
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: /language:java-kotlin
