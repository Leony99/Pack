# CI do backend: testa a API, confere se a imagem Docker monta e procura vulnerabilidades nela.
# Chamado pelo .github/workflows/ci.yml (o código já precisa estar baixado com actions/checkout).

name: CI do backend
description: Instala o Java 21, roda os testes da API, monta a imagem Docker e a varre com o Trivy

runs:
  using: composite
  steps:
    - name: Instalar o Java 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
        cache: maven                # guarda as dependências entre execuções (fica mais rápido)

    # Os testes sobem o próprio PostgreSQL com Testcontainers.
    # O Docker já vem instalado na máquina do GitHub, e não precisa de .env nem de segredos.
    - name: Rodar os testes
      shell: bash
      working-directory: backend
      run: ./mvnw -B test

    # Se algum teste falhar, guarda os relatórios para baixar na página da execução
    - name: Guardar relatórios dos testes
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: relatorios-testes
        path: backend/target/surefire-reports/

    - name: Montar a imagem Docker
      shell: bash
      working-directory: backend
      run: docker build -t pack-api .

    # Trivy: compara cada pacote da imagem (o Alpine, o Java e as bibliotecas dentro do app.jar) com as bases de
    # vulnerabilidades conhecidas (CVEs). Reprova só as CRÍTICAS e ALTAS que já têm correção: essas dá para resolver
    # atualizando a imagem base ou a dependência. Uma CVE nova pode reprovar um PR mesmo sem mudança no código.
    # Ação fixada pelo SHA do commit, e a versão do Trivy também é fixa.
    - name: Procurar vulnerabilidades na imagem (Trivy)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: pack-api
        version: v0.76.1
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'
        format: table
