# CD: publica a versão atual do backend no Google Cloud Run.
# Chamado pelo .github/workflows/ci.yml depois que o CI passou. O job que chama precisa da
# permissão "id-token: write", para pedir o token que o Google aceita no lugar de uma senha.

name: Deploy no Cloud Run
description: Entra no Google Cloud sem chave, envia a imagem ao Artifact Registry e publica no Cloud Run

inputs:
  projeto:
    description: ID do projeto no Google Cloud
    required: true
  regiao:
    description: Região do Cloud Run e do Artifact Registry
    required: true
  provedor-wif:
    description: Provedor do Workload Identity Federation que aceita os tokens do GitHub
    required: true
  conta-deploy:
    description: Conta de serviço que o deploy assume
    required: true

runs:
  using: composite
  steps:
    # Entra no Google Cloud sem chave guardada (Workload Identity Federation, ver producao/gcp/setup.sh)
    - name: Entrar no Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.provedor-wif }}
        service_account: ${{ inputs.conta-deploy }}

    - name: Instalar o gcloud
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    # A tag da imagem é o commit: cada versão publicada aponta para o código exato que a gerou
    - name: Montar e enviar a imagem
      shell: bash
      env:
        IMAGEM: ${{ inputs.regiao }}-docker.pkg.dev/${{ inputs.projeto }}/pack/pack-api:${{ github.sha }}
      run: |
        gcloud auth configure-docker ${{ inputs.regiao }}-docker.pkg.dev --quiet
        docker build -t "$IMAGEM" backend
        docker push "$IMAGEM"

    # Só troca a imagem: memória, variáveis, segredos e acesso público continuam como estão.
    # Por isso um deploy nunca religa a API se o disjuntor de custos a tiver tirado do ar.
    - name: Publicar no Cloud Run
      uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
      with:
        service: pack-api
        region: ${{ inputs.regiao }}
        image: ${{ inputs.regiao }}-docker.pkg.dev/${{ inputs.projeto }}/pack/pack-api:${{ github.sha }}
