# --- Nome ---
spring.application.name=pack-api

# --- Conexão com o banco de dados ---
spring.datasource.url=jdbc:postgresql://localhost:5432/pack-db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuração do Hibernate/JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# --- Porta da aplicação ---
server.port=8080

# --- JWT ---
# Em produção a chave vem da variável de ambiente JWT_SECRET; o valor depois do ":" é só para rodar local
jwt.secret=${JWT_SECRET:pack-api-chave-de-desenvolvimento-troque-em-producao-0123456789}
jwt.expiration-minutes=60

# --- Admin inicial (criado na primeira vez que a aplicação sobe) ---
app.admin.email=${ADMIN_EMAIL:admin@packapi.com}
app.admin.senha=${ADMIN_PASSWORD:admin12345}