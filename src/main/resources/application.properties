# --- Nome ---
spring.application.name=pack-api

# --- Segredos e configurações de cada ambiente ---
# Lidos de variáveis de ambiente. Para rodar local, copie o .env.example para .env (o .env não vai para o git).
# Senhas e a chave do JWT não têm valor padrão: se faltarem, a aplicação nem sobe.
spring.config.import=optional:file:.env[.properties]

# --- Conexão com o banco de dados ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pack-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuração do Hibernate/JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# --- Porta da aplicação ---
server.port=8080

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60

# --- Admin inicial (criado na primeira vez que a aplicação sobe) ---
app.admin.email=${ADMIN_EMAIL:admin@packapi.com}
app.admin.senha=${ADMIN_PASSWORD}
